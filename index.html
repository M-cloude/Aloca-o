<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema SPX - Gestão de Utilitários</title>
    <script src=" https://cdn.jsdelivr.net/ npm/xlsx-js-style@1.2.0/dist/ xlsx.bundle.js "></script>
    <link href=" https://fonts. googleapis.com/css2?family= Inter:wght@400;500;600&family= Montserrat:wght@400;600;700; 800&display=swap " rel="stylesheet">
    <link href=" https://cdnjs. cloudflare.com/ajax/libs/font- awesome/6.4.0/css/all.min.css " rel="stylesheet">
   
    <script src=" https://www.gstatic.com/ firebasejs/8.10.1/firebase- app.js "></script>
    <script src=" https://www.gstatic.com/ firebasejs/8.10.1/firebase- database.js "></script>

    <style>
        :root {
            --brand: #EE4D2D;
            --bg-body: #020617;
            --bg-card: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --success: #10b981;
            --glass: rgba(15, 23, 42, 0.7);
        }
       
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            margin: 0; padding: 0;
            color: var(--text-main); min-height: 100vh;
            background-image: radial-gradient(at 50% 0%, #1a0806 0%, #020617 80%);
            background-attachment: fixed;
        }
       
        .top-bar {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo h1 { font-family: 'Montserrat', sans-serif; font-size: 18px; margem: 0; transformação de texto: maiúsculas; espaçamento entre letras: 1px; }
        .texto-shopee { cor: var(--marca); peso da fonte: 800; }
        .mascote-mini { largura: 30px; altura: automática; margem direita: 10px; alinhamento vertical: meio; }

        .botão-topo-fundo {
            fundo: rgba(255,255, 255, 0.05); borda: 1px sólida rgba(255,255,255,0.1); cor: #cbd5e1;
            padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 600;
            display: none; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn-top-back:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        .container { max-width: 1750px; margin: 40px auto; padding: 0 20px 100px 20px; }

        #view-upload { display: block; text-align: center; margin-top: 80px; animation: fadeIn 0.8s ease-out; }
       
        .hero-title {
            font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 800; margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .upload-box {
            background: rgba(30, 41, 59, 0.3);
            border-radius: 24px; padding: 60px;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer; max-width: 600px; margin: 0 auto;
            transition: all 0.4s;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px -10px rgba(0,0,0,0.5);         .upload-box:hover { border-color: var(--brand); transform: translateY(-5px); }         .upload-icon { font-size: 48px; color: var(--brand); margin-bottom: 20px; }
        #         loading-overlay {             display: none; margin-top: 20px; color: var(--brand); font-weight: bold;             animation: pulse 1.5s infinite;         }         .tab-nav { display: flex; gap: 5px; margin-bottom: 0; }         .tab-btn {             padding: 12px 25px; background: var(--bg-card); border: 1px solid var(--border); border-bottom: none;             color: var(--text-muted); border-radius: 10px 10px 0 0; cursor: pointer; font-weight: 600; font             -size: 11px; text-transform: uppercase;         }         .tab-btn.active { background: var(--brand); color: #fff; border-color: var(--brand); }         .table-wrap {             background: var(--bg-card); border: 1px solid var(--border); border-radius: 0 12px 12px 12px;             padding: 0; overflow: hidden; height: 680px; display: flex; flex-direction: column;         }         .table-scroll { overflow: auto; flex-grow: 1; }         table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }















       





       

        th { position: sticky; top: 0; background: #0b1120; color: #94a3b8; padding: 15px 12px; text-align: left; font-size: 10px; border-bottom: 2px solid var(--border); }
        td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: #e2e8f0; }

        .checkbox-reject { accent-color: #ff003c; width: 18px; height: 18px; cursor: pointer; }
        .text-neon-red {
            color: #ff003c !important;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.8);
            font-weight: 900; font-size: 14px;
        }

        .footer-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95); padding: 15px 30px; border-top: 1px solid var(--border);
            display: flex; justify-content: center; z-index: 2000;
        }

        .hidden { display: none !important; }
        .edit-input { background: transparent; border: 1px solid transparent; color: #fff; width: 100%; padding: 6px; border-radius: 4px; }
        .edit-input:focus { border-color: var(--brand); background: rgba(238, 77, 45, 0.1); outline: none; }

        @keyframes fadeIn { from{opacity:0; transform:translateY(10px);} para{opacity:1; transform:translateY(0);} }
    </style>
</head>
<body>

<div class="top-bar">
    <div style="display:flex; align-items:center;">
        <div class="logo"><h1>Sistema <span class="text-shopee">Shopee</span> </h1></div>
    </div>
    <div style="display:flex; align-items:center; gap: 15px;">
        <div id="file-info" style="font-size:11px; color:#94a3b8;">Aguardando Importação...</div>
        <button id="btn-top-back" class="btn-top-back" onclick="window.location. reload()">
            <i class="fa-solid fa-rotate-left"></i> Voltar / Nova Importação
        </button>
    </div>
</div>

<div class="container">
    <div id="view-upload">
        <h1 class="hero-title">Alocação de Utilitários</h1>
       
        <div class="upload-box" onclick="document. getElementById('upl').click()" >
            <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
            <h2>Clique para Importar Planilha</h2>
            <p style="color:#94a3b8; font-size:12px;">Suporte para soma de múltiplos imports diários</p>
            <input type="file" id="upl" accept=".xlsx" style="display:none">
        </div>
       
        <div id="loading-overlay">PROCESSANDO DADOS...</div>

        <div style="margin-top: 40px;">
            <button class="tab-btn" style="border-radius: 8px; border-bottom: 1px solid var(--border); color:#fff;" onclick="viewGlobalHistory()">
                <i class="fa-solid fa-database"></i> Ver Histórico Online (Sem Planilha)
            </button>
        </div>
    </div>

    <div id="view-dashboard">
        <div class="tab-nav">
            <button class="tab-btn active" onclick="nav('t1', this)"> ✅ALOCADOS</button>
            <button class="tab-btn" onclick="nav('t2', this)"> ⚠️SOBRAS</button>
            <button class="tab-btn" onclick="nav('t4', this)"> 📊HISTÓRICO SEMANAL</button>
        </div>

        <div class="table-wrap">
            <div class="table-scroll">
                <table id="t1">
                    <thead><tr>
                        <th style="width: 40px; text-align:center;">De</th>
                        <th style="width: 60px; text-align:center; color:#ff003c;">Recusou</th>
                        <th style="width: 70px;">Rota AT</th>
                        <th style="width: 110px;">AT / TO</th>
                        <th style="width: 350px;">Nome Motorista</th>
                        <th style="width: 80px;">ID</th>
                        <th>Veículo</th>
                        <th style="color:var(--success)"> Cluster</th>
                    </tr></thead>
                    <tbody id="b-alocados"></tbody>
                </table>

                <table id="t2" class="hidden">
                    <thead><tr><th>Rota AT</th><th>AT Completa</th><th>Litragem</th> <th>Letra</th><th>Cluster Necessário</th></tr></thead>
                    <tbody id="b-rotas"></tbody>
                </table>

                <table id="t4" class="hidden">
                    <thead id="h-historico"></thead>
                    <tbody id="b-historico"></tbody>
                </table>
            </div>
           
            <div id="pull-area" class="btn-pull-area" style="padding:10px; text-align:center;">
                <button style="background:none; border:1px solid #f59e0b; color:#f59e0b; padding:8px 20px; border-radius:5px; cursor:pointer;" onclick="pullRemainingRoutes() ">
                    PUXAR ROTAS SOBRANDO PARA LISTA
                </button>
            </div>
        </div>
    </div>
</div>

<div class="footer-bar hidden" id="footer-actions">
    <button style="background:#10b981; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; font-weight:bold;" onclick="saveDayToFirebase()">
        <i class="fa-solid fa-cloud-arrow-up"></i> SALVAR ALTERAÇÕES ONLINE
    </button>
</div>

<script>
    // CONFIGURAÇÃO FIREBASE DO USUÁRIO
    const firebaseConfig = {
        apiKey: " AIzaSyBxzyFdum86noYdpQnldyjX4w iPB7IJEMY",
        authDomain: " spx-logistica-online.firebaseapp.com ",
        databaseURL: " https://spx-logistica-online- default-rtdb.firebaseio.com " ,
        projectId: "spx-logistica-online", storageBucket: " spx-logistica-online.app " ,
        messagesSenderId: " 347761759499 "         ,         appId: "1:347761759499:web: c257117806c2496fe77e0e"     };     firebase.initializeApp( firebaseConfig);     const database = firebase.database();     let store = { allocated: [], routes: [], drivers: [], memoryRejection: {}, filename: "" };     let db = { dataCode: "" };     let driverMap = {};     let allDriversList = [];     const cleanBasic = t => String(t||"").toUpperCase(). normalize("NFD").replace(/[\ u0300-\u036f]/g,"").trim();     const sanitizeKey = (str) => String(str).replace(/[\.\#\$\[ \]\/]/g, '_');     function getJsDate(cell) {         if(!cell || !cell.v) return new Date();         if(cell.v instanceof Date) return cell.v;         let p = String(cell.v).trim().split(/[ \/\-\.]/);         if(p.length===3) return new Date(p[2], p[1]-1, p[0]);         return new Date();     }     function getDateCode(d) { return `${d.getFullYear()}${String(d. getMonth()+1).padStart(2,'0')} ${String(d.getDate()). padStart(2,'0')}`; }     // DETECÇÃO DE COLUNAS E IMPORTAÇÃO     document.getElementById('upl') .addEventListener('change', function(e) {         if(!e.target.files[0]) return;         document.getElementById(' loading-overlay').style. display = 'block';         const r = new FileReader();         r.onload = function(evt) {             try {                 const wb = XLSX.read(evt.target.result, {tipo: 'array', cellDates:verdadeiro});                 const sR = wb.SheetNames.find(n => n.match(/romaneio/i));                 const sM = wb.SheetNames.find(n => n.match(/motorista/i));




























       







                if(sR && sM) {
                    const wsR = wb.Sheets[sR]; const wsM = wb.Sheets[sM];
                    let dateObj = getJsDate(wsM['A2']);
                    db.dataCode = getDateCode(dateObj);
                    document.getElementById('file- info').innerHTML = `Data Planilha: <b>${dateObj.toLocaleDateString ()}</b>`;

                    let rawRom = XLSX.utils.sheet_to_json(wsR, {header: "A", range: 1});
                    let rawMot = XLSX.utils.sheet_to_json(wsM, {header: "A", range: 1});

                    runEngine(rawRom, rawMot);
                    renderScreen();
                } else { alert("Abas não encontrada. Use 'Romaneio' e 'Motorista'."); }
            } catch (err) { console.error(err); alert("Erro ao ler Excel."); }
            document.getElementById(' loading-overlay').style. display = 'none';
        };
        r.readAsArrayBuffer(e.target. files[0]);
    });

    function runEngine(rom, mot) {
        store.allocated = []; store.routes = []; driverMap = {}; allDriversList = [];
       
        // Mapeia motoristas
        mot.forEach(m => {
            let nome = cleanBasic(m['A']);
            if(nome.length > 2) {
                driverMap[nome] = m['C'] || "";
                allDriversList.push(String(m[' A']).trim());
                if(String(m['G']||"").match(/ FIORINO|VAN|VUC/i)) {
                    store.drivers.push({ nome: String(m['A']).trim(), id: m['C'], cluster: String(m['E']||"") });
                }
            }
        });

        // Match básico (simplificado para não falhar)
        rom.forEach(r => {
            if(!r['B']) return;
            let at = String(r['B']);
            if(at.includes(db.dataCode)) {
                store.routes.push({ rota: r['A'], at: r['B'], cluster: r['F'] || "", litragem: r['T'] || "" });
            }
        });
    }

    // SALVAMENTO V4 (SUPORTA 2 IMPORTAÇÕES + RECUSAS)
    window.saveDayToFirebase = function() {
        if (!db.dataCode) return;
        deixe atualizações = {};

        store.allocated.forEach(a => {
            let keyAT = sanitizeKey( a.at || a.rota);
            let nome = a.nome.trim().toUpperCase();
            if (nome && nome.length > 2) {
                updates['routes/' + keyAT] = { nome: nome, id: a.id };
            }
        });

        // Salva memória de coleta
        Object.keys(store. memoryRejection).forEach(nome => {
            if(store.memoryRejection[nome] .active) {
                updates['rejected/' + sanitizeKey(nome)] = { nome: nome, id: store.memoryRejection[nome].id };
            } else {
                updates['rejected/' + sanitizeKey(nome)] = null;
            }
        });

        banco de dados.ref('shopee_v4/' + db.dataCode).update(atualizações). then(() => {
            alert("Sincronizado com o Histórico Online!");
            loadAndRenderHistory(db. dataCode);
        });
    }

    window.loadAndRenderHistory = função assíncrona (baseDateCode) {
        if (!baseDateCode) retorno;
       
        // Lógica de Datas (Segunda a Domingo)
        let refDate = new Date(baseDateCode.substring(0, 4), parseInt(baseDateCode.substring (4,6))-1, baseDateCode.substring(6,8));
        let dayOfWeek = refDate.getDay();
        let diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        let mondayDate = new Date(refDate);
        mondayDate.setDate(refDate.getDate () + diffToMonday);

        let weekDates = [];
        let thead = `<tr><th>Motorista</th><th>ID</th> `;
        for(let i=0; i<7; i++) {
            let d = new Date(mondayDate); d.setDate(mondayDate.getDate() + i);
            let dCode = getDateCode(d);
            weekDates.push(dCode);
            thead += `<th style="text-align:center;">${ d.getDate()}/${d.getMonth()+1} </th>`;
        }
        thead += `<th>Total</th></tr>`;
        document.getElementById('h- historico').innerHTML = thead;

        // Busca dados no Firebase V4
        let weekData = {};
        try {
            let fetchPromises = weekDates.map(d => database.ref('shopee_v4/' + d).once('value'));
            let snaps = await Promise.all(fetchPromises);
           
            snaps.forEach((s, idx) => {
                let dCode = weekDates[idx];
                if(s.exists()){
                    let day = s.val();
                    // Rotas Normais
                    if(day.routes) Object.values(day.routes). forEach(r => {
                        if(!weekData[r.nome]) weekData[r.nome] = { id: r.id , days: {} };
                        if(!weekData[r.nome].dias[dCode]) weekData[r.nome].days[dCode] = { val: 0, rej: false };
                        weekData[r.nome].days[dCode]. val += 1;
                    });
                    // Rejeições (Sobrepõe)
                    if(day.rejected) Object.values(day.rejected). forEach(rej => {
                        if(!weekData[rej.nome]) weekData[rej.nome] = { id: rej.id , days: {} };
                        if(!weekData[rej.nome].days[ dCode]) weekData[rej.nome].days[dCode] = { val: 0, rej: true };
                        weekData[rej.nome].days[dCode] .rej = true;
                    });
                }
            });
        } catch(e) { console.error(e); }

        let html = "";
        Object.keys(weekData).sort(). forEach(nome => {
            let d = weekData[nome];
            let total = 0;
            html += `<tr><td>${nome}</td><td>${ d. id }</td>`;
            weekDates.forEach(dc => {
                let day = d.days[dc];
                if(!day) html += `<td style="text-align:center; color:#475569;">-</td>`;
                else if(day.rej) html += `<td style="text-align:center;" class="text-neon-red">0</td>`;
                else {
                    html += `<td style="text-align:center; color:#10b981; font-weight:bold;">${day.val}< ​​/td>`;
                    total += day.val;
                }
            });
            html += `<td style="text-align:center; font-weight:800; color:var(--brand);">${total}< /td></tr>`;
        });
        document.getElementById('b- historico').innerHTML = html || "<tr><td colspan='10'>Sem dados nesta semana.</td></tr>";
    }

    window.viewGlobalHistory = function() {
        let today = new Date();
        db.dataCode = getDateCode(today);
        document.getElementById('view- upload').style.display = 'none';
        document.getElementById('view- dashboard').style.display = 'block';
        document.getElementById('btn- top-back').style.display = 'flex';
        nav('t4', document.querySelector(' button[onclick*="t4"]'));
        loadAndRenderHistory(db.dataCode );
    }

    window.nav = function(id,btn) {
        document.querySelectorAll(' table').forEach(t => t.classList.add('hidden'));
        document.getElementById(id) .classList.remove('hidden');
        document.querySelectorAll('. tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('pull- area').style.display = (id === 't1') ? 'block' : 'none';
    }

    window.renderScreen = function() {
        document.getElementById('view- upload').style.display = 'none';
        document.getElementById('view- dashboard').style.display = 'block';
        document.getElementById('btn- top-back').style.display = 'flex';
        document.getElementById(' footer-actions').classList.remove ('hidden');

        let h1 = "";
        store.allocated.forEach((r, i) => {
            h1 += `<tr>
                <td style="text-align:center;">< button style="color:#ef4444; background:none; border:none; cursor:pointer;" onclick="delRow(${i})">X</ button></td>
                <td style="text-align:center;">< input type="checkbox" class="checkbox-reject" onchange="toggleRejection(${i} , this.checked)"></td>
                <td>${r.rota}</td><td>${ r.at }< /td>
                <td><input class="edit-input" value="${r.nome}" onchange="updateRowName(${i}, this.value)" placeholder="Digite nome..."></td>
                <td>${ r.id }</td><td>${r.veic || '-'}</td><td>${r.cluster}</td>
            </tr>`;
        });
        document.getElementById('b- alocados').innerHTML = h1;

        let h2 = "";
        store.routes.forEach(r => {
            h2 += `<tr onclick="allocateManual('${ r. at }')" style="cursor:pointer;"><td>${ r.rota}</td><td>${ r.at }</td>< td>${r.litragem}</td><td>-</ td><td>${r.cluster}</td></tr>` ;
        });
        document.getElementById('b- rotas').innerHTML = h2;

        loadAndRenderHistory(db. dataCode);
    }

    window.toggleRejection = function(idx, checked) {
        let row = store.allocated[idx];
        let nome = row.nome.trim().toUpperCase();
        if(nome.length > 2) {
            store.memoryRejection[nome] = { active: checked, id: row.id };
        }
    }

    window.updateRowName = function(idx, val) {
        let nome = val.trim().toUpperCase();
        store.allocated[idx].nome = val;
        store.allocated[idx].id = driverMap[nome] || "";
        renderScreen();
    }

    window.allocateManual = function(at) {
        let idx = store.routes.findIndex(r => r.at === at);
        let r = store.routes.splice(idx, 1)[0];
        store.allocated.push({ ...r, nome: "", id: "" });
        renderScreen();
    }

    window.delRow = function(idx) {
        let r = store.allocated.splice(idx, 1)[0];
        store.routes.push(r);
        renderScreen();
    }

    window.pullRemainingRoutes = function() {
        while(store.routes.length > 0) {
            let r = store.routes.shift();
            store.allocated.push({ ...r, nome: "", id: "" });
        }
        renderScreen();
    }

</script>
</body>
</html>
